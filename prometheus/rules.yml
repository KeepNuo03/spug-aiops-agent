groups:
  - name: aiops-host
    rules:
      - alert: HostHighCpuUsage
        expr: 100 - (avg by (instance, hostname) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
          intent: cpu_high
        annotations:
          summary: "High CPU usage on {{ $labels.hostname }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (> 80%) for more than 1 minute."
