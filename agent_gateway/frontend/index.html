<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spug AIOps Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Spug AIOps Agent</span>
    </div>
    <span id="connection" class="pill pill-muted">connecting…</span>
  </header>

  <main>
    <aside class="rail">
      <div class="rail-head">
        <h2>Incidents</h2>
        <span id="incident-count" class="count"></span>
      </div>
      <ul id="incident-list" class="incident-list"></ul>
      <p id="empty-list" class="empty">
        Nothing handled yet.<br />
        <span class="empty-hint">Inject a fault and an incident appears here.</span>
      </p>
    </aside>

    <section id="detail" class="detail"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
