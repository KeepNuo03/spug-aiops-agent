<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spug AIOps Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Spug AIOps Agent</h1>
    <span id="connection" class="badge">connecting…</span>
  </header>

  <main>
    <aside>
      <h2>Incidents</h2>
      <ul id="incident-list"></ul>
      <p id="empty-list" class="muted">No alerts handled yet. Inject a fault to see one appear.</p>
    </aside>

    <section id="detail">
      <p class="muted">Select an incident to see how it was handled.</p>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
