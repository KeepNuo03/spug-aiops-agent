route:
  receiver: agent-gateway
  group_by: ["alertname", "hostname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: agent-gateway
    webhook_configs:
      # Switch to http://agent_gateway:8001/webhook/alertmanager once the gateway implements it.
      - url: "http://webhook-echo:8001/webhook/alertmanager"
        send_resolved: true
