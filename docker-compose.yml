services:
  redis:
    # redis-stack-server, not plain redis: the LangGraph checkpointer indexes checkpoints with
    # RediSearch, which the stock image does not ship.
    image: redis/redis-stack-server:7.2.0-v11
    container_name: aiops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    # Incident records and the approval audit trail: business data that is queried and kept.
    # Redis holds the graph checkpoints, which are runtime state and may be discarded.
    image: postgres:16-alpine
    container_name: aiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops.local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aiops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aiops-alertmanager
    restart: unless-stopped
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # Lab host monitored by Prometheus and managed by Spug over SSH (host port 2222).
  lab-host:
    build: ./lab/target-host
    container_name: aiops-lab-host
    hostname: lab-host
    restart: unless-stopped
    ports:
      - "2222:22"
      - "9100:9100"
    volumes:
      # Keeps Spug's installed SSH key across container re-creation.
      - lab-host-ssh:/root/.ssh

  mcp_server:
    build: ./mcp_server
    container_name: aiops-mcp-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      SPUG_BASE_URL: http://host.docker.internal:8080
    ports:
      - "8765:8765"
    depends_on:
      - prometheus

  agent_gateway:
    build: ./agent_gateway
    container_name: aiops-agent-gateway
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MCP_SERVER_URL: http://mcp_server:8765/mcp
      DATABASE_URL: postgresql://aiops:aiops.local@postgres:5432/aiops
      DIAGNOSIS_LANGUAGE: ${DIAGNOSIS_LANGUAGE:-en}
    ports:
      - "8001:8001"
    depends_on:
      mcp_server:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  lab-host-ssh:
  postgres-data:

# Spug runs as a separate runtime dependency (see README "License"); it is not orchestrated here.
