version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: aiops-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aiops-alertmanager
    restart: unless-stopped
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"

  mcp_server:
    build: ./mcp_server
    container_name: aiops-mcp-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8765:8765"
    depends_on:
      - prometheus
      - redis

  agent_gateway:
    build: ./agent_gateway
    container_name: aiops-agent-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - mcp_server
      - redis

# 注意:Spug 本体(SSH 执行 / 通知渠道来源)作为独立运行时依赖单独部署,
# 不在本 compose 文件中编排,详见 README「许可证」章节。
